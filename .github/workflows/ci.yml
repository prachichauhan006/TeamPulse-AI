name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r backend/requirements-dev.txt
      - name: Ruff
        working-directory: backend
        run: ruff check app
      - name: Pytest with isolated SQLite and MockAIProvider
        working-directory: backend
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Unit tests
        working-directory: frontend
        run: npm test
      - name: Typecheck and production build
        working-directory: frontend
        run: npm run build

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    env:
      APP_ENV: development
      AI_PROVIDER: mock
      POSTGRES_DB: teampulse_e2e
      POSTGRES_USER: teampulse_e2e
      CORS_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
      VITE_API_BASE_URL: http://127.0.0.1:8000/api/v1
      E2E_BASE_URL: http://127.0.0.1:5173
      E2E_API_BASE_URL: http://127.0.0.1:8000/api/v1
      E2E_SKIP_WEBSERVER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Generate disposable runtime-only settings
        run: |
          echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "JWT_SECRET_KEY=$(openssl rand -hex 48)" >> "$GITHUB_ENV"
      - name: Start PostgreSQL, Redis, backend, Celery, and frontend
        run: docker compose up -d --build
      - name: Apply database migrations
        run: docker compose run --rm backend alembic upgrade head
      - name: Wait for browser-facing services
        run: |
          curl --fail --silent --show-error --retry 30 --retry-delay 2 --retry-connrefused http://127.0.0.1:8000/health
          curl --fail --silent --show-error --retry 30 --retry-delay 2 --retry-connrefused http://127.0.0.1:5173/ > /dev/null
      - name: Install E2E dependencies and Chromium
        working-directory: frontend
        run: npm ci && npx playwright install --with-deps chromium
      - name: Playwright with MockAIProvider and isolated data
        working-directory: frontend
        run: npm run e2e
      - name: Stop disposable runtime
        if: always()
        run: docker compose down --remove-orphans
